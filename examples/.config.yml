clone_path: "/tmp/nosygit/"
shallow:
  enabled: true
  depth: 50
  max_deepen: 3

watchers:
  security-mention:
    type: regex
    regex: "(security|crypto|certificate|cert|upload|download)"
    path-exclude: ".*(test|mock|poetry).*"
    on:
      - ADD
      - EDIT
      - REMOVE

  customer-account-id:
    type: regex
    regex: "(acme_account_id)"
    path-exclude: ".*(test|mock).*"
    on:
      - ADD
      - EDIT
      - REMOVE

  new-route-added:
    type: regex
    regex: "@.*route.*(get|post|put|delete)"
    path-exclude: ".*(test|mock).*"
    on:
      - ADD

  routes-touched:
    type: file
    glob: ".*routes.py$"
    on:
      - ADD
      - EDIT
      - REMOVE

  dockerfile-edited:
    type: file
    glob: "Dockerfile"
    on:
      - CREATE
      - EDIT

  gh-repo-added:
    type: repo
    provider: github-main
    org: acme
    on:
      - ADD

  gl-repo-added:
    type: repo
    provider: gitlab-main
    org: acme
    on:
      - ADD

  repo-public:
    type: repo-visibility
    provider: github-main
    org: acme

  branch-lifecycle:
    type: branch
    provider: github-main
    org: acme
    on:
      - ADD
      - DELETE

events:
  print-all:
    driver: stdout

providers:
  github-main:
    driver: github
    owner: acme

  gitlab-main:
    driver: gitlab
    owner: acme

  local:
    driver: local
