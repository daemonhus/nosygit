clone_path: "/tmp/nosygit/"
shallow:
  enabled: true
  depth: 50
  max_deepen: 3

watchers:
  new-route-added:
    type: regex
    regex: "@.*route.*(get|post|patch|put|delete)"
    path-exclude: ".*(test|mock).*"
    on:
      - ADD

  routes-touched:
    type: file
    glob: ".*routes.py$"
    on:
      - ADD
      - EDIT
      - REMOVE

  dockerfile-edited:
    type: file
    glob: "Dockerfile"
    on:
      - CREATE
      - EDIT

  gh-repo-added:
    type: repo
    provider: github-main
    org: acme
    on:
      - ADD

  gl-repo-added:
    type: repo
    provider: gitlab-main
    org: acme
    on:
      - ADD

  repo-public:
    type: repo-visibility
    provider: github-main
    org: acme

  branch-lifecycle:
    type: branch
    provider: github-main
    org: acme
    on:
      - ADD
      - DELETE

events:
  print-all:
    driver: stdout

providers:
  github-main:
    driver: github
    owner: acme

  gitlab-main:
    driver: gitlab
    owner: acme

  internal-tools:
    driver: git
    url: https://git.example.com/acme/internal-tools.git
    poll_every: 5m
